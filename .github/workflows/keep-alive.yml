name: Keep Render Alive
on:
  schedule:
    # Every 5 minutes (off the :00/:05 marks to avoid GitHub Actions delays).
    # Note: GitHub Actions cron can still be delayed 5-15 min during high load.
    # For production reliability, also use an external monitor like UptimeRobot
    # (free, pings every 5 min with no delay).
    - cron: "4,9,14,19,24,29,34,39,44,49,54,59 * * * *"
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Health check ping
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://techpharma-5ml5.onrender.com/api/health)
          echo "Health check returned: $RESPONSE"
          if [ "$RESPONSE" != "200" ]; then
            echo "WARNING: Server returned non-200 status. It may be sleeping or down."
            # Retry once after 30s to give Render time to wake up
            sleep 30
            RESPONSE2=$(curl -s -o /dev/null -w "%{http_code}" https://techpharma-5ml5.onrender.com/api/health)
            echo "Retry returned: $RESPONSE2"
            if [ "$RESPONSE2" != "200" ]; then
              echo "ERROR: Server is not responding after retry."
              exit 1
            fi
          fi
          echo "Server is awake and healthy."
